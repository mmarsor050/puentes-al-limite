<title>Puentes al límite</title>
<style>
/* Concepto: obra en una rambla almeriense — consola de obra oscura con acento naranja de señalización. Un solo look, elegido a propósito. */
:root {
  --ink: #18222a; --ink-2: #22303a; --ink-3: #2e3f4b; --paper: #f4ead7; --muted: #a9b6bd;
  --signal: #d32f2f; --signal-2: #ff6b6b; --tension: #ffc400; --bad: #e5484d; --compr: #1e64ff; --ok: #3fb27f;
  --f-display: 'Barlow Condensed', 'Arial Narrow', sans-serif; --f-body: 'Atkinson Hyperlegible', system-ui, sans-serif; --f-mono: 'JetBrains Mono', ui-monospace, monospace;
  --accent-t: #5fd38d; --on-accent: #18222a; --t-red: var(--t-red); --t-blue: var(--t-blue); --ok-t: var(--ok-t); --warn-t: var(--warn-t); --warn-b: var(--warn-b); --bad-bg: #5a2a2d;
  color-scheme: dark;
}
:root[data-ui="light"] {
  --ink: #eef0f3; --ink-2: #ffffff; --ink-3: #d3d8de; --paper: #1e2a33; --muted: #59646e; --signal-2: #b71c1c;
  --accent-t: #1f8a4c; --t-red: #c0303a; --t-tens: #8a6a00; --bad: #c62828; --t-blue: #1f5fc4; --ok-t: #1f7a48; --warn-t: #8a6200; --warn-b: #c9a640; --bad-bg: #f6d4d6;
  color-scheme: light;
}

html, body { height: 100%; }
body { background: var(--ink); color: var(--paper); font-family: var(--f-body); font-size: 15px; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--signal-2); outline-offset: 2px; }
#app { height: 100%; display: flex; flex-direction: column; }
#hud { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--ink-3); }
.ghost { background: transparent; border: 1px solid var(--ink-3); border-radius: 6px; padding: 6px 10px; font-family: var(--f-display); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; font-size: 14px; }
.ghost:hover { border-color: var(--muted); }
.ico { display: inline-grid; place-items: center; width: 34px; height: 32px; padding: 0; }
.ico[aria-pressed="false"] svg .wave { display: none; }
.ico[aria-pressed="false"] svg .x { display: inline; }
.ico svg .x { display: none; }
#lvlTitle { font-family: var(--f-display); font-weight: 700; font-size: 22px; letter-spacing: .02em; line-height: 1; white-space: nowrap; }
#lvlTitle small { display: block; font-family: var(--f-mono); font-weight: 500; font-size: 11px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; margin-top: 3px; }
#budget { margin-left: auto; min-width: 200px; flex: 0 1 300px; }
#budget .row { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
#budget .row b { color: var(--paper); }

.chiprow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.rhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }

@keyframes pop { 0% { transform: scale(0) rotate(-30deg); opacity: 0; } 70% { transform: scale(1.3); opacity: 1; } 100% { transform: scale(1); } }
.facts, .tgr { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }

#toasts { position: fixed; z-index: 60; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; pointer-events: none; }

.field { display: grid; gap: 6px; }

.bgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }

.rub tr.on td:first-child { box-shadow: inset 4px 0 0 var(--accent-t); }
.shot { display: grid; gap: 14px; }
.shot .phead { padding-bottom: 12px; }
.shot .pid h2 { font-size: 36px; }

/* taller */
.thead { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.thead h2 { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: clamp(30px, 6vw, 48px); text-transform: uppercase; }
.tabs { display: flex; gap: 4px; margin: 18px 0 20px; border-bottom: 1px solid var(--ink-3); overflow-x: auto; }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 14px; font-family: var(--f-display); font-weight: 700; font-size: 18px; letter-spacing: .03em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--paper); border-bottom-color: var(--signal); }

.tcard svg, .qcard svg { width: 100%; height: auto; background: #f7f2e7; border-radius: 8px; display: block; }
.tcard h3 { margin: 4px 0 0; font-family: var(--f-display); font-weight: 800; font-size: 28px; text-transform: uppercase; color: var(--ec); }
.tcard p { margin: 0; line-height: 1.5; }
.tcard dl { margin: 0; display: grid; gap: 4px; }
.tcard dt { font-family: var(--f-mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }

<script>
// ===== Motor de física: barras XPBD, rotura por esfuerzo y vehículo =====
// Unidades: metros, segundos; masa en "quintales" (100 kg); fuerza en ~kN.
const G = 9.8;
const MAT = {
  road:  { nombre: 'Calzada', cost: 180, maxLen: 2.1,  mass: 0.4, EA: 12000, tens: 235, comp: 200, road: true },
  wood:  { nombre: 'Madera',  cost: 90,  maxLen: 2.9,  mass: 0.2, EA: 9000,  tens: 240, comp: 190 },
  steel: { nombre: 'Acero',   cost: 230, maxLen: 3.2,  mass: 0.35, EA: 24000, tens: 480, comp: 400 },
  cable: { nombre: 'Cable',   cost: 120, maxLen: 9.0,  mass: 0.05, EA: 16000, tens: 450, comp: 0, tensionOnly: true }
};
const VEH = {
  car:   { nombre: 'Tractor', mass: 7, wheelR: 0.52, wheelRF: 0.3, base: 1.6, h: 0.75, speed: 4.2, accel: 9 },
  truck: { nombre: 'Camión', mass: 13, wheelR: 0.42, base: 2.4, h: 1.15, speed: 3.2, accel: 6 }
};

function segClosest(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const l2 = dx * dx + dy * dy || 1e-9;
  let t = ((px - ax) * dx + (py - ay) * dy) / l2;
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  return { t, x: ax + dx * t, y: ay + dy * t };
}

function designCost(design) {
  let c = 0;
  for (const b of design.beams) {
    const A = design.nodes[b.a], B = design.nodes[b.b];
    c += Math.hypot(B.x - A.x, B.y - A.y) * MAT[b.mat].cost;
  }
  return Math.round(c);
}

function createSim(level, design, opts = {}) {
  const P = []; // partículas
  const nodeIndex = design.nodes.map(n => {
    P.push({ x: n.x, y: n.y, px: n.x, py: n.y, m: 0, w: 0, fixed: !!n.anchor });
    return P.length - 1;
  });
  const beams = design.beams.map(b => {
    const mat = MAT[b.mat];
    const a = nodeIndex[b.a], c = nodeIndex[b.b];
    const L = Math.hypot(P[c].x - P[a].x, P[c].y - P[a].y);
    const m = mat.mass * L;
    P[a].m += m / 2; P[c].m += m / 2;
    return { a, b: c, mat: b.mat, L, k: mat.EA / L, f: 0, fs: 0, ratio: 0, broken: false, src: b };
  });
  for (const p of P) p.w = p.fixed || p.m === 0 ? 0 : 1 / p.m;

  // Vehículo: 2 ruedas + 2 puntos de carrocería, unidos rígidamente
  const V = VEH[level.vehicle];
  const startX = opts.startX ?? level.startX ?? -5, y0 = level.leftY ?? 0;
  const hb = V.base / 2, r = V.wheelR, rf = V.wheelRF || V.wheelR;
  const vp = [
    [startX - hb, y0 + r, 0.35, r], [startX + hb, y0 + rf, 0.35, rf],
    [startX - hb * 0.8, y0 + r + V.h, 0.15, 0], [startX + hb * 0.8, y0 + rf + V.h, 0.15, 0]
  ].map(([x, y, f, wr]) => { P.push({ x, y, px: x, py: y, m: V.mass * f, w: 1 / (V.mass * f), veh: true, r: wr }); return P.length - 1; });
  const vc = [];
  for (let i = 0; i < 4; i++) for (let j = i + 1; j < 4; j++) {
    const A = P[vp[i]], B = P[vp[j]];
    vc.push({ a: vp[i], b: vp[j], L: Math.hypot(B.x - A.x, B.y - A.y) });
  }
  const wheels = [vp[0], vp[1]];

  const statics = level.terrain.segs; // [[ax,ay,bx,by],...]
  const sim = {
    P, beams, vc, wheels, vp, V, t: 0, status: 'run', events: [], maxRatio: 0,
    goalX: level.goalX, waterY: level.waterY, nodeIndex, speedMul: opts.speedMul ?? 1, noDrive: !!opts.noDrive
  };

  const SUB = 24, h = 1 / 60 / SUB;
  sim.frame = function () {
    if (sim.status !== 'run') return;
    const drive = sim.t > 0.9 && !sim.noDrive;
    for (const b of beams) b.facc = 0;
    // la gravedad entra de forma gradual para que la estructura se asiente sin golpe
    const g = G * Math.min(1, sim.t / 0.6);
    const damp = sim.t < 0.9 ? 0.9995 : 0.99995;
    for (let s = 0; s < SUB; s++) {
      // integrar
      for (const p of P) {
        if (p.w === 0) continue;
        const vx = (p.x - p.px) * damp, vy = (p.y - p.py) * damp;
        p.px = p.x; p.py = p.y;
        p.x += vx; p.y += vy - (p.veh ? G : g) * h * h;
      }
      // barras (XPBD)
      for (const b of beams) {
        if (b.broken) continue;
        const A = P[b.a], B = P[b.b];
        const wsum = A.w + B.w;
        if (wsum === 0) continue;
        let dx = B.x - A.x, dy = B.y - A.y;
        const d = Math.hypot(dx, dy) || 1e-9;
        const C = d - b.L;
        if (MAT[b.mat].tensionOnly && C < 0) { continue; }
        const at = 1 / b.k / (h * h);
        const dl = (-C) / (wsum + at);
        const nx = dx / d, ny = dy / d;
        A.x -= nx * dl * A.w; A.y -= ny * dl * A.w;
        B.x += nx * dl * B.w; B.y += ny * dl * B.w;
        b.facc += -dl / (h * h); // + tracción, - compresión
      }
      // vehículo rígido
      for (const c of vc) {
        const A = P[c.a], B = P[c.b];
        const dx = B.x - A.x, dy = B.y - A.y, d = Math.hypot(dx, dy) || 1e-9;
        const C = d - c.L, wsum = A.w + B.w, s2 = C / wsum;
        A.x += dx / d * s2 * A.w; A.y += dy / d * s2 * A.w;
        B.x -= dx / d * s2 * B.w; B.y -= dy / d * s2 * B.w;
      }
      // contacto ruedas
      for (const wi of wheels) {
        const W = P[wi];
        if (s === 0) W.ct = 0;
        let cn = null;
        const tryCol = (ax, ay, bx, by, ia, ib) => {
          const q = segClosest(W.x, W.y, ax, ay, bx, by);
          let dx = W.x - q.x, dy = W.y - q.y;
          const dist = Math.hypot(dx, dy);
          const R = W.r || V.wheelR;
          if (dist >= R || dist < 1e-6) return;
          const nx = dx / dist, ny = dy / dist;
          const wa = ia >= 0 ? P[ia].w : 0, wb = ib >= 0 ? P[ib].w : 0;
          const ws = W.w + (1 - q.t) ** 2 * wa + q.t ** 2 * wb;
          const lam = (R - dist) / ws;
          W.x += nx * lam * W.w; W.y += ny * lam * W.w;
          if (ia >= 0) { P[ia].x -= nx * lam * (1 - q.t) * wa; P[ia].y -= ny * lam * (1 - q.t) * wa; }
          if (ib >= 0) { P[ib].x -= nx * lam * q.t * wb; P[ib].y -= ny * lam * q.t * wb; }
          if (ny > 0.3) { cn = [nx, ny]; W.ct = ia >= 0 ? 1 : 2; }
        };
        for (const b of beams) {
          if (b.broken || !MAT[b.mat].road) continue;
          const A = P[b.a], B = P[b.b];
          tryCol(A.x, A.y, B.x, B.y, b.a, b.b);
        }
        for (const sg of statics) tryCol(sg[0], sg[1], sg[2], sg[3], -1, -1);
        // tracción del motor
        if (cn && drive) {
          const tx = cn[1], ty = -cn[0]; // tangente hacia +x
          const vx = (W.x - W.px) / h, vy = (W.y - W.py) / h;
          const vt = vx * tx + vy * ty;
          let dv = V.speed * sim.speedMul - vt;
          const lim = V.accel * h * 2;
          dv = Math.max(-lim, Math.min(lim, dv));
          W.px -= tx * dv * h; W.py -= ty * dv * h;
        }
      }
    }
    // esfuerzos y rotura
    let mr = 0;
    for (let bi = 0; bi < beams.length; bi++) {
      const b = beams[bi];
      if (b.broken) continue;
      const f = b.facc / SUB;
      b.fs = b.fs * 0.6 + f * 0.4;
      const m = MAT[b.mat];
      const lim = b.fs >= 0 ? m.tens : m.comp;
      b.ratio = lim > 0 ? Math.abs(b.fs) / lim : (b.fs < 0 ? 0 : 0);
      if (sim.t > 0.15 && b.ratio > 1) {
        b.broken = true;
        const A = P[b.a], B = P[b.b];
        sim.events.push({ type: 'break', bi, mat: b.mat, x: (A.x + B.x) / 2, y: (A.y + B.y) / 2, t: sim.t });
      } else if (b.ratio > mr) mr = b.ratio;
    }
    sim.maxRatio = Math.max(sim.maxRatio, mr);
    sim.t += 1 / 60;
    // estado
    const cx = (P[vp[0]].x + P[vp[1]].x) / 2;
    if (vp.some(i => P[i].y < sim.waterY + 0.3)) sim.status = 'fail';
    else if (cx > sim.goalX) sim.status = 'win';
    else if (sim.t > 120 && !sim.noDrive) sim.status = 'fail';
  };
  return sim;
}


// ===== Niveles =====
function mkLevel(o) {
  const W = o.gap, lY = o.leftY || 0, rY = o.rightY || 0, wY = o.waterY ?? -7;
  const anchors = [[0, lY], [W, rY], ...(o.anchors || [])];
  const segs = [
    [-12, lY, 0, lY], [0, lY, 0, wY - 2],
    [W, rY, W + 12, rY], [W, wY - 2, W, rY]
  ];
  for (const p of (o.piers || [])) {
    segs.push([p.x - p.w / 2, p.top, p.x + p.w / 2, p.top], [p.x - p.w / 2, wY - 2, p.x - p.w / 2, p.top], [p.x + p.w / 2, p.top, p.x + p.w / 2, wY - 2]);
  }
  return Object.assign({
    leftY: lY, rightY: rY, waterY: wY, anchors, terrain: { segs },
    goalX: W + 3, startX: -5, vehicle: 'car', mats: ['road', 'wood', 'steel', 'cable'],
    view: { x0: -6, x1: W + 6, y0: wY - 1.5, y1: Math.max(Math.max(lY, rY) + (o.viewTop || 5), Math.max(...anchors.map(p => p[1])) + 1.6) }
  }, o, { anchors });
}

const LEVELS = [
  mkLevel({ id: 1, tod: 'manana', nombre: { es: 'Primer paso', en: 'First step' }, gap: 6, budget: 3000, mats: ['road', 'wood'] }),
  mkLevel({ id: 2, tod: 'manana', nombre: { es: 'El triángulo', en: 'The triangle' }, gap: 8, budget: 4450, mats: ['road', 'wood'] }),
  mkLevel({ id: 3, tod: 'manana', nombre: { es: 'Celosía', en: 'Truss' }, gap: 12, budget: 9000, mats: ['road', 'wood', 'steel'] }),
  mkLevel({ id: 4, tod: 'mediodia', nombre: { es: 'Por debajo', en: 'From below' }, gap: 10, budget: 6000, anchors: [[0, -3], [10, -3]], mats: ['road', 'wood', 'steel'] }),

const CLASE = {
  1: { ok: 0,
    es: { concepto: 'Estructura y carga', texto: 'Una estructura es un conjunto de elementos que soporta fuerzas y las lleva hasta el suelo sin romperse ni deformarse en exceso. Esas fuerzas se llaman cargas: aquí son el peso del tractor y el peso del propio puente.', pista: 'Prueba primero solo con calzada. ¿Aguanta el peso del tractor? Después añade barras de madera por encima.', pregunta: '¿Qué es una carga en una estructura?', opciones: ['Una fuerza que actúa sobre ella', 'El material con el que está hecha', 'La forma que tiene'], explica: 'Las cargas son fuerzas: el peso propio (carga permanente) y lo que pasa por encima, como el tractor (carga variable).' },
    en: { concepto: 'Structure and load', texto: 'A structure is a set of parts that holds forces and carries them down to the ground without breaking or bending too much. Those forces are called loads: here, the weight of the tractor and the weight of the bridge itself.', pista: 'Try with road only first. Does it hold the tractor? Then add wooden beams on top.', pregunta: 'What is a load on a structure?', opciones: ['A force acting on it', 'The material it is made of', 'Its shape'], explica: 'Loads are forces: the self-weight (permanent load) and whatever goes over it, like the tractor (live load).' } },
  2: { ok: 1,
    es: { concepto: 'Triangulación', texto: 'Las barras de un puente se unen con nudos que pueden girar. Un cuadrado con nudos así se deforma y se convierte en un rombo; un triángulo no puede cambiar de forma sin que alguna barra cambie de longitud. Por eso las estructuras se triangulan.', pista: 'Forma triángulos encima de la calzada: cada tramo de calzada debe ser la base de un triángulo.', pregunta: '¿Por qué se usan triángulos en las estructuras de barras?', opciones: ['Porque pesan menos que otras figuras', 'Porque no se deforman aunque sus nudos puedan girar', 'Porque son más fáciles de fabricar'], explica: 'El triángulo es la única figura indeformable con uniones articuladas: para cambiar su forma habría que alargar o acortar una barra.' },
    en: { concepto: 'Triangulation', texto: 'Bridge beams are joined at joints that can rotate. A square with such joints deforms into a rhombus; a triangle cannot change shape unless a beam changes length. That is why structures are triangulated.', pista: 'Make triangles above the road: each road segment should be the base of a triangle.', pregunta: 'Why are triangles used in beam structures?', opciones: ['Because they weigh less than other shapes', "Because they don't deform even if their joints can rotate", 'Because they are easier to make'], explica: 'The triangle is the only shape that cannot deform with pinned joints: to change it you would have to stretch or shorten a beam.' } },
  3: { ok: 0,
    es: { concepto: 'Estructuras de celosía', texto: 'Una celosía es una estructura formada por barras que dibujan triángulos. Usa poco material y resiste mucho: la verás en grúas, torres eléctricas y cubiertas de naves. En esta obra aparece el acero, más resistente que la madera pero bastante más caro.', pista: 'Una celosía más alta reparte mejor los esfuerzos. Usa acero solo en las barras que lo necesiten.', pregunta: '¿Qué ventaja tiene una celosía frente a una viga maciza?', opciones: ['Resiste lo mismo con menos material', 'No necesita apoyos', 'Se dobla menos con el calor'], explica: 'Al triangular, cada barra trabaja casi solo a tracción o compresión, y así se aprovecha mejor el material.' },
    en: { concepto: 'Truss structures', texto: 'A truss is a structure made of beams forming triangles. It uses little material and is very strong: you can see it in cranes, pylons and warehouse roofs. Steel appears on this site: stronger than wood but much more expensive.', pista: 'A taller truss spreads stresses better. Use steel only where it is needed.', pregunta: 'What advantage does a truss have over a solid beam?', opciones: ['It is just as strong with less material', "It doesn't need supports", 'It bends less with heat'], explica: 'With triangles, each beam works almost only in tension or compression, so the material is used more efficiently.' } },
  4: { ok: 2,
    es: { concepto: 'Tracción y compresión', texto: 'Una barra sufre tracción cuando las fuerzas tiran de ella y tiende a alargarse. Sufre compresión cuando la empujan y tiende a acortarse. Con el botón Esfuerzos verás el amarillo para la tracción y el azul para la compresión: cuanto más intenso, más cerca está de romperse.', pista: 'Aquí puedes anclar barras más abajo, en la pared del barranco. Construye la estructura por debajo de la calzada.', pregunta: 'Una barra que tiende a alargarse porque tiran de sus extremos sufre…', opciones: ['Compresión', 'Flexión', 'Tracción'], explica: 'Tracción: las fuerzas tiran hacia fuera. Compresión: las fuerzas empujan hacia dentro.' },
    en: { concepto: 'Tension and compression', texto: 'A beam is in tension when forces pull it and it tends to stretch. It is in compression when forces push it and it tends to shorten. With the Stress button you will see yellow for tension and blue for compression: the brighter, the closer to breaking.', pista: 'Here you can anchor beams lower down, on the wall of the ravine. Build the structure below the road.', pregunta: 'A beam that tends to stretch because its ends are pulled is in…', opciones: ['Compression', 'Bending', 'Tension'], explica: 'Tension: forces pull outwards. Compression: forces push inwards.' } },
  5: { ok: 1,
    es: { concepto: 'Apoyos intermedios', texto: 'Cuanto mayor es la distancia entre apoyos (la luz), mayores son los esfuerzos. Una pila en el centro divide el puente en dos tramos más cortos, y cada uno trabaja mucho menos.', pista: 'Lleva barras desde la pila hasta la calzada para que el centro del puente no quede colgando.', pregunta: '¿Qué ocurre con los esfuerzos al añadir un apoyo intermedio?', opciones: ['Aumentan, porque hay más barras', 'Disminuyen, porque cada tramo es más corto', 'No cambian'], explica: 'Al reducir la luz de cada tramo, las barras soportan menos esfuerzo y el puente puede ser más ligero y barato.' },
    en: { concepto: 'Intermediate supports', texto: 'The longer the distance between supports (the span), the bigger the stresses. A pier in the middle splits the bridge into two shorter spans, and each one works much less.', pista: "Run beams from the pier to the road so the middle of the bridge isn't left hanging.", pregunta: 'What happens to the stresses when you add an intermediate support?', opciones: ['They increase, because there are more beams', 'They decrease, because each span is shorter', "They don't change"], explica: 'By shortening each span, the beams carry less stress and the bridge can be lighter and cheaper.' } },
  6: { ok: 0,
    es: { concepto: 'El arco', texto: 'El arco desvía las cargas hacia los lados y las lleva a los estribos, los apoyos de los extremos. Trabaja casi todo a compresión, por eso los romanos podían construir arcos con piedra, un material que resiste mal la tracción.', pista: 'Dibuja una curva desde los anclajes bajos hacia el centro y une la calzada a ella con barras verticales y diagonales.', pregunta: '¿A qué esfuerzo trabaja principalmente un arco?', opciones: ['Compresión', 'Tracción', 'Torsión'], explica: 'Las piezas del arco se empujan unas contra otras. Por eso necesita apoyos firmes que aguanten ese empuje.' },
    en: { concepto: 'The arch', texto: 'An arch turns loads sideways and carries them to the abutments, the supports at each end. It works almost entirely in compression, which is why the Romans could build arches in stone, a material that is weak in tension.', pista: 'Draw a curve from the low anchors towards the middle and join the road to it with vertical and diagonal beams.', pregunta: 'What stress does an arch mainly work in?', opciones: ['Compression', 'Tension', 'Torsion'], explica: 'The pieces of an arch push against each other. That is why it needs firm supports that resist that thrust.' } },
  7: { ok: 1,
    es: { concepto: 'Cables y tirantes', texto: 'Un cable solo trabaja a tracción: si intentas empujarlo, se dobla. Es ligero, barato y muy resistente cuando tira. Los puentes atirantados cuelgan la calzada de cables unidos a torres altas, como el puente del Alamillo en Sevilla.', pista: 'Tiende cables desde lo alto de cada torre hasta varios nudos de la calzada. Un cable no puede medir más de 9 m.', pregunta: '¿Por qué un cable no sirve para soportar compresión?', opciones: ['Porque es demasiado pesado', 'Porque se dobla al empujarlo', 'Porque se oxida'], explica: 'Un cable no tiene rigidez para mantenerse recto si lo empujan. Solo es útil cuando tira de algo.' },
    en: { concepto: 'Cables and stays', texto: 'A cable only works in tension: if you push it, it buckles. It is light, cheap and very strong when it pulls. Cable-stayed bridges hang the road from cables fixed to tall towers, like the Alamillo bridge in Seville.', pista: 'Run cables from the top of each tower to several road joints. A cable cannot be longer than 9 m.', pregunta: "Why can't a cable carry compression?", opciones: ['Because it is too heavy', 'Because it bends when pushed', 'Because it rusts'], explica: 'A cable has no stiffness to stay straight when pushed. It is only useful when it pulls.' } },
  8: { ok: 1,
    es: { concepto: 'Coeficiente de seguridad', texto: 'Los ingenieros no diseñan un puente para la carga justa: lo preparan para resistir bastante más de lo previsto. Ese margen es el coeficiente de seguridad. Ahora pasa un camión que pesa casi el doble que el tractor.', pista: 'Fíjate en el porcentaje de carga de cada barra. Si alguna pasa del 80 %, refuérzala.', pregunta: '¿Para qué sirve el coeficiente de seguridad?', opciones: ['Para abaratar la obra', 'Para que la estructura resista más carga de la prevista', 'Para que el puente pese menos'], explica: 'El margen cubre lo que no se puede prever: materiales con defectos, cargas mayores, viento o el paso de los años.' },
    en: { concepto: 'Safety factor', texto: "Engineers don't design a bridge for the exact load: they make it able to resist much more than expected. That margin is the safety factor. Now a truck crosses, weighing almost twice as much as the tractor.", pista: 'Watch the load percentage of each beam. If any goes over 80 %, reinforce it.', pregunta: 'What is the safety factor for?', opciones: ['To make the work cheaper', 'So the structure resists more load than expected', 'So the bridge weighs less'], explica: 'The margin covers what cannot be foreseen: faulty materials, bigger loads, wind or the passing of the years.' } },
  9: { ok: 2,
    es: { concepto: 'Flexión y rigidez', texto: 'Una viga apoyada en sus extremos y cargada en el centro se curva: sufre flexión. La parte de arriba se comprime y la de abajo se estira. Una estructura rígida apenas se deforma con la carga, y eso es importante cuando la calzada sube una pendiente.', pista: 'La orilla derecha está más alta. Construye una rampa suave y triangúlala para que no se combe.', pregunta: 'Una viga horizontal cargada en el centro sufre principalmente…', opciones: ['Torsión', 'Cortadura', 'Flexión'], explica: 'En la flexión la cara superior trabaja a compresión y la inferior a tracción. Por eso una celosía tiene un cordón arriba y otro abajo.' },
    en: { concepto: 'Bending and stiffness', texto: 'A beam supported at both ends and loaded in the middle curves: it is in bending. The top is compressed and the bottom is stretched. A stiff structure hardly deforms under load, which matters when the road climbs a slope.', pista: "The right bank is higher. Build a gentle ramp and triangulate it so it doesn't sag.", pregunta: 'A horizontal beam loaded in the middle is mainly in…', opciones: ['Torsion', 'Shear', 'Bending'], explica: 'In bending the top face works in compression and the bottom in tension. That is why a truss has one chord on top and another below.' } },
  10: { ok: 1,
    es: { concepto: 'Tipos de puentes', texto: 'Puentes de viga, de arco, colgantes y atirantados: cada tipo encaja con una luz y un terreno. Para salvar distancias muy grandes se combinan torres, cables y apoyos intermedios. Esta última obra pide todo lo que has aprendido.', pista: 'Combina tirantes desde las torres con barras apoyadas en la pila central.', pregunta: 'Para salvar un río muy ancho con pocos apoyos, ¿qué tipo de puente se suele elegir?', opciones: ['De viga simple', 'Atirantado o colgante', 'De arco de piedra'], explica: 'Los cables trabajan a tracción con muy poco peso propio, así que permiten luces enormes con pocas pilas.' },
    en: { concepto: 'Types of bridges', texto: 'Beam, arch, suspension and cable-stayed bridges: each type suits a span and a terrain. To cross very long distances, towers, cables and intermediate supports are combined. This last site needs everything you have learnt.', pista: 'Combine stays from the towers with beams resting on the central pier.', pregunta: 'To cross a very wide river with few supports, which type of bridge is usually chosen?', opciones: ['Simple beam', 'Cable-stayed or suspension', 'Stone arch'], explica: 'Cables work in tension with very little self-weight, so they allow huge spans with few piers.' } }

function prepDeco(L) {
  if (L._deco) return L._deco;
  const r = rng(L.id * 7 + 3), D = { far: [], mid: [], clouds: [], plants: [], stones: [], cracks: [] };
  for (let k = 0; k < 6; k++) D.far.push([r() * 6, 0.6 + r() * 1.6, r() * 0.5]);
  for (let k = 0; k < 6; k++) D.mid.push([r() * 6, 1 + r() * 2, r() * 0.5]);
  for (let k = 0; k < 5; k++) D.clouds.push({ x: r(), y: 0.06 + r() * 0.22, s: 0.6 + r() * 0.8, v: 0.004 + r() * 0.006 });
  const v = L.view;
  const plantKinds = ['chumbera', 'esparto', 'almendro', 'esparto', 'piedra'];
  for (let k = 0; k < 7; k++) {
    const left = k % 2 === 0;
    const x = left ? v.x0 + 0.3 + r() * (Math.min(-1.2, -0.6) - v.x0 - 0.3) : L.gap + 1.2 + r() * (v.x1 - L.gap - 1.5);
    if (left && x > -1) continue;
    if (!left && Math.abs(x - L.goalX) < 0.8) continue;
    D.plants.push({ x, kind: plantKinds[Math.floor(r() * plantKinds.length)], s: 0.7 + r() * 0.6, left });
  }
  for (let k = 0; k < 18; k++) {
    const left = r() < 0.5;
    const depth = 0.4 + r() * (L.leftY - L.waterY - 1);
    D.stones.push({ left, x: left ? -0.3 - r() * 5 : L.gap + 0.3 + r() * 5, y: (left ? L.leftY : L.rightY) - depth, s: 0.08 + r() * 0.16, rot: r() * 3 });
  }
  for (let k = 0; k < 6; k++) {
    const left = k % 2 === 0, x0 = left ? -0.2 - r() * 3 : L.gap + 0.2 + r() * 3, y0 = (left ? L.leftY : L.rightY) - 0.6 - r() * 3;
    const pts = [[x0, y0]]; for (let i = 0; i < 4; i++) { const p = pts[pts.length - 1]; pts.push([p[0] + (r() - 0.5) * 0.7, p[1] - 0.25 - r() * 0.5]); }
    D.cracks.push(pts);
  }
  L._deco = D; return D;
}

// ---------- cielo y fondos lejanos (espacio de pantalla, con paralaje) ----------
function drawSky(t) {

  if (HI()) { const hg = ctx.createRadialGradient(cx, cy, R * 0.6, cx, cy, R * 4); hg.addColorStop(0, sc + 'aa'); hg.addColorStop(1, sc + '00'); ctx.fillStyle = hg; ctx.fillRect(0, 0, VW, VH); }

    const x = (((c.x + (HI() ? t * c.v : 0)) % 1.3) - 0.15) * VW, y = c.y * VH, w = 90 * c.s * Math.max(0.6, VW / 1000);

    ctx.beginPath(); ctx.ellipse(x, y, w * 0.5, w * 0.16, 0, 0, 7); ctx.ellipse(x - w * 0.22, y + 2, w * 0.28, w * 0.13, 0, 0, 7); ctx.ellipse(x + w * 0.18, y - w * 0.06, w * 0.24, w * 0.16, 0, 0, 7); ctx.fill();
  }

    ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(-10, VH);
    for (let i = 0; i <= 80; i++) {
      const x = i / 80, X = x * (VW + 40) - 20 - par * f;
      let y = 0; arr.forEach(([fr, a, ph], j) => { y += Math.sin((x + par * f / VW) * (fr + 1.5) * 4 + ph * 9 + j) * a / (j + 1); });
      ctx.lineTo(X, base - y * amp);

    }
  };
  layer(D.far, VH * 0.42, VH * 0.07, P.far, 0.08, 'far');
  layer(D.mid, VH * 0.52, VH * 0.06, P.mid, 0.2, 'mid');
}

// ---------- terreno, agua, pilas y torres (espacio del mundo) ----------

function drawWater(t) {

    for (let k = 0; k < 14; k++) { const x = ((k * 73.1 + t * 18 * (k % 3 + 1)) % (VW + 120)) - 60, y = Y + 8 + (k * 13 % Math.max(10, VH - Y - 10)); ctx.fillRect(x, y, 30 + (k % 4) * 14, 2); }

function plant(p, t) {

  ctx.strokeStyle = '#2b3138'; ctx.lineWidth = Math.max(2, S * 0.05); ctx.beginPath(); ctx.moveTo(X, Y); ctx.lineTo(X, Y - H); ctx.stroke();

// ---------- rejilla de plano técnico y cotas ----------
function insideRockL(L, x, y) {
  if (x < -0.01 && y < L.leftY - 0.01) return true;
  if (x > L.gap + 0.01 && y < L.rightY - 0.01) return true;
  if (y < L.waterY + 0.4) return true;
  for (const p of (L.piers || [])) if (Math.abs(x - p.x) < p.w / 2 - 0.01 && y < p.top - 0.01) return true;
  return false;
}

  ctx.rect(sx(v.x0 - 2), sy(v.y1 + 2), sx(0) - sx(v.x0 - 2), sy(L.leftY) - sy(v.y1 + 2));
  ctx.rect(sx(L.gap), sy(v.y1 + 2), sx(v.x1 + 2) - sx(L.gap), sy(L.rightY) - sy(v.y1 + 2));

function drawBlueprint() {

const STRESS_T = [255, 196, 0], STRESS_C = [30, 100, 255];

    ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = cap; if (dash) ctx.setLineDash(dash);
    ctx.beginPath(); ctx.moveTo(X1 + nx * off, Y1 + ny * off); ctx.lineTo(X2 + nx * off, Y2 + ny * off); ctx.stroke(); if (dash) ctx.setLineDash([]);
  };

  } else if (mat === 'wood') {

    }

      const a = Math.random() * Math.PI * 2, sp = b.mat === 'steel' ? 4 + Math.random() * 6 : 1.5 + Math.random() * 3.5;

    }

const SFX = {
  on: true, ac: null, noise: null, motor: null,

      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;

      const n = this.ac.createBuffer(1, this.ac.sampleRate, this.ac.sampleRate), d = n.getChannelData(0);

  },
  ok() { if (!this.on || !this.ac) return false; if (this.ac.state === 'suspended') this.ac.resume(); return true; },
  env(g, t0, a, peak, d) { g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(peak, t0 + a); g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + d); },
  tone(f, d, type = 'sine', peak = 0.15, when = 0, f2 = null) {

  },
  place() { this.tone(880, 0.05, 'triangle', 0.08); },

// ===== Códigos de partida (compartido por la app del alumno y la del profesor) =====
// Formatos: PAL2.<deflate-raw base64url>.<control> · PAL2U.<base64url>.<control> · PAL1-<base64>-<control> (antiguo)
const b64u = bytes => { let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
const unb64u = s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; const bin = atob(s), out = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out; };
const sum4 = s => { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return (h % 65536).toString(16).padStart(4, '0'); };
async function pipe(bytes, Stream, kind) { const s = new Blob([bytes]).stream().pipeThrough(new Stream(kind)); return new Uint8Array(await new Response(s).arrayBuffer()); }

// Devuelve { fmt: 'PAL1' | 'PAL2', o } con el objeto tal como viaja en el código, o null si no es válido.
async function decodeRaw(code) {
  code = String(code || '').replace(/\s+/g, '');
  try {
    if (code.startsWith('PAL1-')) {
      const m = /^PAL1-([A-Za-z0-9+/=]+)-([0-9a-f]{4})$/.exec(code); if (!m || sum4(m[1]) !== m[2]) return null;
      const o = JSON.parse(decodeURIComponent(escape(atob(m[1]))));
      return o && o.id && o.nombre && o.progress ? { fmt: 'PAL1', o } : null;
    }
    const m = /^(PAL2U?)\.([A-Za-z0-9_-]+)\.([0-9a-f]{4})$/.exec(code); if (!m || sum4(m[2]) !== m[3]) return null;
    let bytes = unb64u(m[2]); if (m[1] === 'PAL2') bytes = await pipe(bytes, DecompressionStream, 'deflate-raw');
    const o = JSON.parse(new TextDecoder().decode(bytes));
    return o && o.id && o.nombre && o.progress ? { fmt: 'PAL2', o } : null;
  } catch (e) { return null; }
}

// Separa un texto con varios códigos pegados (los saltos de línea pueden partir un código).
function splitCodes(text) {
  const out = [];
  for (const frag of String(text || '').split(/\s+/).filter(Boolean)) {
    if (/^PAL[12]/.test(frag) || !out.length) out.push(frag); else out[out.length - 1] += frag;
  }
  return out;
}

// Banda de Séneca (0..4) a partir de una nota.
function bandaDe(n) { return n < 3 ? 0 : n < 5 ? 1 : n < 7 ? 2 : n < 9 ? 3 : 4; }

// Nota por criterio, función pura. p: perfil con progress y taller; nObras y nPuentes: tamaños del juego.
// Devuelve [] si el curso no tiene evaluación criterial; nota = null si no hay evidencia.
function criteriaGrades(p, nObras, nPuentes) {
  if (!CRIT.cursos.includes(p.curso)) return [];
  const br = (p.taller && p.taller.bridges) || {}, prog = p.progress || {};
  let hechos = 0, s = 0;
  for (let i = 0; i < nPuentes; i++) { const b = br[i]; if (b && b.total) { hechos++; s += b.ok / b.total * 10; } }
  const ganadas = Object.values(prog).filter(r => r && r.won).length;
  return CRIT.lista.map(c => {
    if (!hechos && !ganadas) return { codigo: c.codigo, nota: null, banda: null };
    const senala = s / nPuentes, obras = Math.min(ganadas, nObras) / nObras * 10;
    const nota = Math.round((c.pesos.senala * senala + c.pesos.obras * obras) * 10) / 10;
    return { codigo: c.codigo, nota, banda: bandaDe(nota), senala, obras, ganadas: Math.min(ganadas, nObras) };
  });
}

function csvCell(v) {

// alumnos: [{ id, nombre, curso, grupo, savedAt, progress, taller }]; ajustes: { [id]: { [codigo]: { nota, obs } } }

function targetFor(startIdx, x, y) {
  const A = design.nodes[startIdx], maxL = MAT[tool].maxLen;

  for (let i = -r; i <= r; i++) for (let j = -r; j <= r; j++) {

    const L = Math.hypot(gx - A.x, gy - A.y); if (L < 0.4 || L > maxL + 1e-6) continue;
    if (insideRock(gx, gy) && nodeAt(gx, gy, 0.01) < 0) continue;

}

    let hb = -1, hn = -1;
    if (pointer.in && !pointer.drag) { hn = nodeAt(px, py, Math.max(0.35, 16 / S)); if (delMode && hn < 0) hb = beamAt(px, py, Math.max(0.25, 10 / S)); }
    for (const pass of [0, 1]) design.beams.forEach((b, i) => { if ((pass === 0) !== (b.mat === 'road')) return; const A = design.nodes[b.a], B = design.nodes[b.b]; drawBeamGfx(A.x, A.y, B.x, B.y, b.mat, { highlight: i === hb ? 'rgba(229,72,77,.55)' : null }); });
    if (showDims) drawDims(design, l => fmtNum(l, 2));
    if (pointer.drag && pointer.drag.tgt) {
      const A = design.nodes[pointer.drag.from], T = pointer.drag.tgt, L = Math.hypot(T.x - A.x, T.y - A.y);
      ctx.strokeStyle = 'rgba(30,42,51,.45)'; ctx.setLineDash([5, 5]); ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(sx(A.x), sy(A.y), MAT[tool].maxLen * S, 0, 7); ctx.stroke(); ctx.setLineDash([]);
      drawBeamGfx(A.x, A.y, T.x, T.y, tool, { alpha: 0.7 });
      const lbl = `${fmtNum(L, 2)} m · ${fmtMoney(L * MAT[tool].cost)}`;
      ctx.font = '600 12px "JetBrains Mono", monospace'; const tw = ctx.measureText(lbl).width; const mx = (sx(A.x) + sx(T.x)) / 2, my = (sy(A.y) + sy(T.y)) / 2 - 18;
      ctx.fillStyle = 'rgba(24,34,42,.92)'; ctx.fillRect(mx - tw / 2 - 6, my - 10, tw + 12, 20); ctx.fillStyle = '#f4ead7'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(lbl, mx, my);
      if (T.node < 0) drawJoint(T.x, T.y, false, true);
    }
    design.nodes.forEach((n, i) => drawJoint(n.x, n.y, n.anchor, i === hn || (pointer.drag && pointer.drag.from === i)));
    if (showGrid) drawGridLabels(n => fmtNum(n, 0));
    FX.draw(); drawVehicleGfx(parked, level.vehicle, tm);
  }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); FX.drawScreen();
  const tip = $('#tip');
  if (hoverInfo) { tip.hidden = false; tip.style.left = pointer.x + 'px'; tip.style.top = pointer.y + 'px'; tip.textContent = `${t('m_' + hoverInfo.mat)} · ${Math.round(Math.min(1, hoverInfo.ratio) * 100)} % · ${hoverInfo.fs >= 0 ? t('tensionL') : t('compressionL')}`; }
  else tip.hidden = true;
}

  const node = (x, y) => { let i = nodes.findIndex(n => Math.abs(n.x - x) < 1e-6 && Math.abs(n.y - y) < 1e-6); if (i < 0) { nodes.push({ x, y }); i = nodes.length - 1; } return i; };

}

  });
  st.d.nodes.forEach((n, i) => { const p = P[st.sim.nodeIndex[i]]; drawJoint(p.x, p.y, n.anchor); });
  drawVehicleGfx(st.sim, level.vehicle, 0);
  st.marks.forEach((k, i) => {
    const b = st.sim.beams[k], X = sx((P[b.a].x + P[b.b].x) / 2), Y = sy((P[b.a].y + P[b.b].y) / 2), R = Math.max(11, S * 0.32);
    const a = st.ans[i], truth = b.fs >= 0 ? 't' : 'c';
    ctx.fillStyle = a === 't' ? C.t : a === 'c' ? C.c : C.bg;
    ctx.beginPath(); ctx.arc(X, Y, R, 0, 7); ctx.fill();
    ctx.lineWidth = st.checked ? 4 : 2.5; ctx.strokeStyle = st.checked ? (a === truth ? '#3fb27f' : '#ffcf4d') : '#fff'; ctx.stroke();
    ctx.fillStyle = a === 't' ? '#1e2a33' : '#fff'; ctx.font = `700 ${Math.round(R * 1.1)}px "JetBrains Mono", monospace`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(i + 1), X, Y + 1);
  });
  st.geom = { S, OX, OY };
  [ctx, VW, VH, S, OX, OY, level, sim, CAM.cx, CAM.cy, CAM.z] = save;
}

function tallerHTML() {
  const tab = taller.tab, ES = ESF[LANG];
  if (tab === 'teoria') {
    return `<p class="lead">${t('tLead')}</p>
    <div class="tgrid">${TEORIA.map((e, i) => { const x = TEO_TXT[LANG][i]; return `<article class="tcard" style="--ec:${e.col}"><svg viewBox="0 0 320 170" role="img" aria-label="${x.k}">${teoSVG(i)}</svg><h3>${x.k}</h3><p>${x.def}</p><dl><dt>${t('examples')}</dt><dd>${x.ej}</dd><dt>${t('inBridge')}</dt><dd>${x.puente}</dd></dl></article>`; }).join('')}</div>`;
  }
  if (tab === 'quiz') {
    const q = me.taller.quiz, done = Object.keys(q).length, ok = Object.entries(q).filter(([i, a]) => SITU[i].ok === a).length;
    return `<div class="qhead"><p class="lead">${t('qLead')}</p><div class="score"><span>${t('hits')}</span><b>${ok} / ${SITU.length}</b><button class="tool" id="qReset">${t('restart')}</button></div></div>
    <div class="qgrid">${SITU.map((s, i) => {
      const a = q[i], [txt, ex] = SITU_TXT[LANG][i];
      return `<article class="qcard ${a === undefined ? '' : a === s.ok ? 'is-ok' : 'is-ko'}"><svg viewBox="0 0 200 150" role="img" aria-label="${txt}">${ico[s.i]}</svg><p><b>${i + 1}.</b> ${txt}</p>
        <div class="qopts">${ES.map((e, j) => `<button class="qo ${a === undefined ? '' : j === s.ok ? 'right' : j === a ? 'wrong' : ''}" data-q="${i}" data-a="${j}" ${a !== undefined ? 'disabled' : ''}>${e}</button>`).join('')}</div>
        ${a !== undefined ? `<p class="qex">${a === s.ok ? t('correct') + ' ' : t('wasX', { x: ES[s.ok].toLowerCase() }) + ' '}${ex}</p>` : ''}</article>`;
    }).join('')}</div>${done === SITU.length ? `<p class="final">${t('result')}: <b>${ok} / ${SITU.length}</b>. ${ok >= 8 ? t('qGood') : ok >= 5 ? t('qMid') : t('qLow')}</p>` : ''}`;
  }
  const st = taller.st;
  const ok = st.checked ? st.marks.filter((k, i) => st.ans[i] === (st.sim.beams[k].fs >= 0 ? 't' : 'c')).length : 0;
  return `<p class="lead">${t('mLead')}</p>
    <div class="seg" role="group">${PUENTES.map((p, i) => `<button class="segb" data-b="${i}" aria-pressed="${i === taller.bridge}">${PUENTES_TXT[LANG][i][0]}</button>`).join('')}</div>
    <div class="bwrap"><canvas id="tCv"></canvas></div>
    <div class="blist">${st.marks.map((k, i) => {
      const b = st.sim.beams[k], truth = b.fs >= 0 ? 't' : 'c', a = st.ans[i];
      return `<div class="brow ${st.checked ? (a === truth ? 'is-ok' : 'is-ko') : ''}"><span class="bn">${i + 1}</span><span class="bm">${t('m_' + b.mat)}</span>
        <button class="pick t" data-m="${i}" data-v="t" aria-pressed="${a === 't'}" ${st.checked ? 'disabled' : ''}>${t('tension')}</button><button class="pick c" data-m="${i}" data-v="c" aria-pressed="${a === 'c'}" ${st.checked ? 'disabled' : ''}>${t('compression')}</button>
        ${st.checked ? `<span class="bres">${a === truth ? t('good') : t('isX', { x: truth === 't' ? t('tensionL') : t('compressionL') })} · ${Math.round(Math.min(1, b.ratio) * 100)} %</span>` : ''}</div>`;
    }).join('')}</div>
    <div class="actions">${st.checked ? `<p class="final" style="margin:0 auto 0 0">${t('hits')}: <b>${ok} / ${st.marks.length}</b></p><button class="btn alt" id="bRetry">${t('retry')}</button>` : `<button class="btn" id="bCheck" ${st.ans.some(a => !a) ? 'disabled' : ''}>${t('checkB')}</button>`}</div>
    ${st.checked ? `<p class="hint">${PUENTES_TXT[LANG][st.i][1]}</p>` : ''}`;
}
function renderTaller() {
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === taller.tab)));
  $('#tBody').innerHTML = tallerHTML();
  if (taller.tab === 'quiz') {
    document.querySelectorAll('.qo').forEach(b => b.onclick = () => {
      me.taller.quiz[b.dataset.q] = +b.dataset.a;
      const q = me.taller.quiz;
      if (Object.keys(q).length === SITU.length) { const ok = Object.entries(q).filter(([i, a]) => SITU[i].ok === a).length; me.taller.quizBest = Math.max(me.taller.quizBest ?? 0, ok); }
      saveDB(); checkBadges(); renderTaller();
    });
    $('#qReset').onclick = () => { me.taller.quiz = {}; saveDB(); renderTaller(); };
  }
  if (taller.tab === 'puente') {
    document.querySelectorAll('.segb').forEach(b => b.onclick = () => { taller.bridge = +b.dataset.b; prepBridge(taller.bridge); renderTaller(); });
    document.querySelectorAll('.pick').forEach(b => b.onclick = () => { taller.st.ans[+b.dataset.m] = b.dataset.v; renderTaller(); });
    if ($('#bCheck')) $('#bCheck').onclick = () => {
      const st = taller.st; st.checked = true;
      const ok = st.marks.filter((k, i) => st.ans[i] === (st.sim.beams[k].fs >= 0 ? 't' : 'c')).length, prev = me.taller.bridges[st.i];
      if (!prev || ok > prev.ok) me.taller.bridges[st.i] = { ok, total: st.marks.length };
      saveDB(); checkBadges(); renderTaller();
    };
    if ($('#bRetry')) $('#bRetry').onclick = () => { prepBridge(taller.bridge); renderTaller(); };
    const cvs = $('#tCv');
    cvs.onclick = e => {
      const st = taller.st; if (st.checked || !st.geom) return;
      const r = cvs.getBoundingClientRect(), X = e.clientX - r.left, Y = e.clientY - r.top;
      const g = st.geom, x = (X - g.OX) / g.S, y = (g.OY - Y) / g.S, P = st.sim.P;
      let best = -1, bd = Math.max(0.6, 18 / g.S);
      st.marks.forEach((k, i) => { const b = st.sim.beams[k]; const d = Math.hypot((P[b.a].x + P[b.b].x) / 2 - x, (P[b.a].y + P[b.b].y) / 2 - y); if (d < bd) { bd = d; best = i; } });
      if (best >= 0) { const a = st.ans[best]; st.ans[best] = a === null ? 't' : a === 't' ? 'c' : null; renderTaller(); }
    };
    requestAnimationFrame(renderBridge);
  }
}
function openTaller() {
  if (!taller.st) prepBridge(taller.bridge);
  show('#menu', false); show('#taller', true); renderTaller(); $('#taller').scrollTop = 0;
}
document.querySelectorAll('.tab').forEach(b => b.onclick = () => { taller.tab = b.dataset.tab; renderTaller(); });
$('#tallerBtn').onclick = openTaller;
$('#tBack').onclick = () => { show('#taller', false); renderMenu(); show('#menu', true); };
window.addEventListener('resize', () => requestAnimationFrame(renderBridge));

boot();
</script>
